name: e2e-linux-trial

# A measurement, not a gate: the end-to-end suite in WebKit on Linux, sharded
# wide, and the Rust shell on Linux, to see whether either can leave the five
# macOS slots. Nothing requires this workflow; `gate` is unchanged by it.

on:
  push:
    branches: [ci-speed-e2e]
  workflow_dispatch:
    inputs:
      workers:
        description: Playwright workers per shard
        default: '2'

concurrency:
  group: e2e-linux-trial-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  e2e-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    name: e2e-linux (${{ matrix.shard }}/8)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # As the `perf` job installs WebKit (gate.yml), sharing its caches.
      - name: Read the Playwright version and the runner image
        id: playwright
        run: |
          {
            echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)"
            echo "os=${ImageOS}"
            echo "image=${ImageOS}-${ImageVersion}"
          } >> "$GITHUB_OUTPUT"

      - name: Make apt time out and retry
        run: |
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-519 > /dev/null

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: webkit
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ steps.playwright.outputs.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Install WebKit
        if: steps.webkit.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: pnpm exec playwright install webkit

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: webkit-debs
        with:
          path: ~/.cache/webkit-debs
          key: webkit-debs-${{ steps.playwright.outputs.image }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Install WebKit's system packages
        timeout-minutes: 9
        env:
          WEBKIT_DEBS_CACHE_HIT: ${{ steps.webkit-debs.outputs.cache-hit }}
        run: tools/ci/install-webkit-deps.sh "$HOME/.cache/webkit-debs"

      - name: End-to-end, an eighth of the suite
        run: pnpm e2e --shard=${{ matrix.shard }}/8 --workers=${{ inputs.workers || '2' }} --reporter=list,html

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: linux-playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  rust-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Make apt time out and retry
        run: |
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-519 > /dev/null

      # What Tauri 2 links against on Linux.
      - name: Install Tauri's system packages
        timeout-minutes: 9
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Lint Rust shell
        run: pnpm rust:lint

      - name: Read the embedding model's revision
        id: embedding-model
        run: |
          revision=$(grep -m1 -o 'revision: "[0-9a-f]*"' apps/desktop/src-tauri/src/embeddings.rs | cut -d'"' -f2)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/atlas-test-models
          key: embedding-model-${{ steps.embedding-model.outputs.revision }}

      - name: Test Rust shell
        run: pnpm rust:test
        env:
          ATLAS_TEST_MODEL_DIR: ${{ runner.temp }}/atlas-test-models
