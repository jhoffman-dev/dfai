name: gate

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the whole gate before it builds (#481).
  workflow_call:

concurrency:
  # By workflow too, so a release's run of the gate on `main` cannot cancel,
  # or be cancelled by, the gate a push to `main` started.
  group: gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # Named, so a failure on the left of a pipe fails the step (`-o pipefail`).
    shell: bash

# The slow work is split across machines: the unit tests over six, the
# end-to-end suite over four, the response-time and work budgets over four.
# `gate`, at the bottom, is the one check to require.
#
# macOS: the account runs only five macOS jobs at once, and a full run uses
# exactly five (four end-to-end shards and `rust`). Add a sixth and it queues.

jobs:
  changes:
    # Decides whether the slow jobs are needed. A job rather than a workflow-level
    # `paths:` filter, because a workflow that never starts never reports `gate`,
    # and a required check that never reports blocks the merge for good.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request is checked out as its merge into the base, so the
          # first parent is the base and the diff between them is the change.
          fetch-depth: 2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Is this more than documentation?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only --no-renames HEAD^1 HEAD \
              | node tools/ci/changed-scope.mjs | tee -a "$GITHUB_OUTPUT"
          else
            echo code=true | tee -a "$GITHUB_OUTPUT"
          fi

  static:
    # Everything that fails fast, and the only job a docs-only change still
    # runs: the formatter checks Markdown too.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Every version file says the same version
        run: pnpm version:check

      # Each keeps one core busy, so side by side they take about as long as
      # lint alone: 55 s, 46 s and 72 s one after another. Each one's output is
      # printed whole, in this order, in a group of its own.
      - name: Format, typecheck and lint
        run: tools/ci/side-by-side.sh 'pnpm format:check' 'pnpm typecheck' 'pnpm lint'

      - name: Build frontend
        run: pnpm build

      # A part loaded on first use that imports a chunk other than the entry
      # cannot recover from a failed load (#552).
      - name: No chunk shared under a part
        run: pnpm check:chunks

      # The webview has no Node: a built-in the build swapped for an empty
      # object fails only when it runs, in WebKit (#53).
      - name: No Node built-in in the app's bundle
        run: pnpm check:node-builtins

  unit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Linux, because none of this needs macOS and macOS jobs are the scarce ones.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    name: unit (${{ matrix.shard }}/6)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The sync tests merge with real git under an isolated HOME, so a merge
      # commit takes the identity git guesses from the machine: the account's
      # full name and the host's domain. A Mac has both; this runner has neither.
      - name: Give git a name and host to guess from, as a Mac does
        run: |
          sudo usermod --comment 'DFAI CI' "$(whoami)"
          sudo hostname "$(hostname).local"

      # A sixth of the tests cannot meet the coverage thresholds, so the shard
      # config leaves them out. What this shard covered goes into its blob, and
      # the `coverage` job holds the six together to the thresholds. The files
      # are dealt out by how long each took on CI (tools/ci/unit-shards.ts):
      # dealt by Vitest's hash of their paths, three shards took 8 to 12 minutes.
      - name: Test, a sixth of the suite
        run: >
          pnpm exec vitest run --config tools/ci/vitest.shard.config.ts
          --coverage --coverage.reporter=text-summary
          --shard=${{ matrix.shard }}/6 --reporter=default --reporter=blob

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-blob-${{ matrix.shard }}
          path: .vitest/blob/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  coverage:
    # Puts the six shards' coverage back together and holds it to the
    # thresholds in vitest.config.ts: the repo floor and each module's own.
    # Then checks every test file ran on some shard.
    needs: [changes, unit]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unit-blob-*
          path: .vitest/blob
          merge-multiple: true

      - name: Merge coverage and enforce the thresholds
        run: >
          pnpm exec vitest --merge-reports --coverage
          --reporter=default --reporter=json --outputFile.json=unit-report.json

      # The shards are dealt by recorded durations rather than by Vitest, so
      # this proves the deal left no file out. It also writes this run's
      # durations, the `unit-durations` artifact, for when the shards drift.
      - name: Every test file ran on a shard
        run: |
          pnpm exec vitest list --filesOnly --json > unit-files.json
          node tools/ci/unit-report.mjs unit-report.json unit-files.json unit-durations.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-durations
          path: unit-durations.json
          retention-days: 30

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  rust:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # macOS because the Tauri shell links against WebKit.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # The `stable` branch, pinned; the toolchain itself is named below.
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Lint Rust shell
        run: pnpm rust:lint

      # The embedding model the Rust tests run (ADR-0031), 91 MB, kept between
      # runs under its pinned revision so a warm run never touches the network.
      # rust-cache does not keep target/tmp, where the tests fetch it otherwise.
      - name: Read the embedding model's revision
        id: embedding-model
        run: |
          revision=$(grep -m1 -o 'revision: "[0-9a-f]*"' apps/desktop/src-tauri/src/embeddings.rs | cut -d'"' -f2)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/atlas-test-models
          key: embedding-model-${{ steps.embedding-model.outputs.revision }}

      - name: Test Rust shell
        run: pnpm rust:test
        env:
          ATLAS_TEST_MODEL_DIR: ${{ runner.temp }}/atlas-test-models

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # macOS because the end-to-end suite drives the same WebKit the Tauri window
    # uses. One worker per machine, as before; the four machines are the speed-up.
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: e2e (${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The OS release goes in the key (`ImageOS`, e.g. macos15): Playwright
      # builds WebKit per release, so a runner moving to a new one must not
      # restore the old build. `ImageOS` is a runner variable, not in `env`.
      - name: Read the Playwright version and the OS release
        id: playwright
        run: |
          echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
          echo "os=${ImageOS}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: webkit
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ steps.playwright.outputs.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Install WebKit for end-to-end tests
        if: steps.webkit.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps webkit

      # `pnpm e2e` builds first, here on the shard: the build takes seconds, and
      # handing `dist` over from another job would hold every shard back until
      # that job had installed and built.
      #
      # No `--trace=retain-on-failure`: tracing every test took the four shards
      # from 1114 s to 1479 s between them when it was measured (#113). A failed
      # shard uploads the HTML report and each failure's error context instead.
      - name: End-to-end, a quarter of the suite
        run: pnpm e2e --shard=${{ matrix.shard }}/4 --reporter=list,html

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  perf-part:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # On the 2,000-note fixture vault: the response-time budgets (#217) for
    # filing from the Inbox and opening a note, and the work budgets
    # (`tools/perf/budgets.json`), counts of what each action makes the app
    # do. Linux, because macOS jobs are the scarce ones and WebKit runs here
    # too; the time budgets have headroom for it, and counts do not vary.
    #
    # In four parts, each on a machine of its own: on one, the work budgets
    # took 13 minutes, three of them building the cache of meanings for the
    # main fixture's last action, once per pass (#648). The main fixture's two
    # counted runs are two of the parts, and `perf` below holds run 2 to run 1
    # as one machine did, so the counts are shown to repeat across runners.
    # Its timed pass has a machine to itself, so its times are not a busy
    # machine's. The response times, which are gated, run alone too, before
    # the rest. `perf` puts the parts' reports back together.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: main counted, run 1
            fixtures: main
            passes: counted
            runs: 1
            first-run: 1
          - part: main counted, run 2
            fixtures: main
            passes: counted
            runs: 1
            first-run: 2
          - part: main timed
            fixtures: main
            passes: timed
            runs: 1
            first-run: 1
          - part: latency, and the other fixtures
            fixtures: research,long-note,code-note
            passes: counted,timed
            runs: 2
            first-run: 1
            latency: true
    name: perf (${{ matrix.part }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # WebKit and the apt packages it needs come from caches, so a slow apt
      # mirror costs a run only when a key changes (#519). Both are restored and
      # saved as separate steps, not with `actions/cache`'s post step, so a run
      # whose budgets fail still saves what it downloaded.
      - name: Read the Playwright version and the runner image
        id: playwright
        run: |
          {
            echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)"
            echo "os=${ImageOS}"
            echo "image=${ImageOS}-${ImageVersion}"
          } >> "$GITHUB_OUTPUT"

      # Fail a dead connection fast and retry it. A trickling one is caught by
      # the time limits in tools/ci/install-webkit-deps.sh instead.
      - name: Make apt time out and retry
        run: |
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-519 > /dev/null

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: webkit
        with:
          path: ~/.cache/ms-playwright
          # The release (ubuntu24) but not the image version: WebKit is built
          # per Ubuntu release, and weekly image updates do not change it.
          key: playwright-webkit-${{ runner.os }}-${{ steps.playwright.outputs.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Install WebKit
        if: steps.webkit.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: pnpm exec playwright install webkit

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.webkit.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.webkit.outputs.cache-primary-key }}

      # The .deb files apt downloaded for WebKit, keyed on the runner image so
      # they match what is already installed on it. A new image misses once.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: webkit-debs
        with:
          path: ~/.cache/webkit-debs
          key: webkit-debs-${{ steps.playwright.outputs.image }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      # A hit installs from the cached files with no download at all. A miss
      # downloads only what WebKit lacks, under a time limit with retries (the
      # script says how), and keeps the files for the next run. A failure here
      # stops the job: nothing after it can run without these packages.
      - name: Install WebKit's system packages
        timeout-minutes: 9
        env:
          WEBKIT_DEBS_CACHE_HIT: ${{ steps.webkit-debs.outputs.cache-hit }}
        run: tools/ci/install-webkit-deps.sh "$HOME/.cache/webkit-debs"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.webkit-debs.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/webkit-debs
          key: ${{ steps.webkit-debs.outputs.cache-primary-key }}

      # One build for both runs, unminified so the work budgets can name the
      # components that rendered. So the response-time budgets here time the
      # unminified bundle, not the shipped one: a little slower to parse, which
      # their headroom covers. `pnpm perf` locally builds minified, so its
      # times differ a little from this job's.
      - name: Build the frontend, keeping component names
        id: build
        run: pnpm --filter @dfai/desktop exec vite build --minify false

      - name: Response times on the fixture vault
        if: matrix.latency
        run: pnpm exec playwright test --config playwright.perf.config.ts --project latency --reporter=list

      # Run even when a time budget failed, so a red run still says what the
      # counts were, but only on a build: without one (WebKit's packages did not
      # install, say) the run would only time out waiting for the server.
      - name: Work budgets on the fixture vault
        if: (success() || failure()) && steps.build.outcome == 'success'
        run: pnpm exec playwright test --config playwright.perf.config.ts --project budgets --reporter=list
        env:
          PERF_BUDGETS_FIXTURES: ${{ matrix.fixtures }}
          PERF_BUDGETS_PASSES: ${{ matrix.passes }}
          PERF_BUDGETS_RUNS: ${{ matrix.runs }}
          PERF_BUDGETS_FIRST_RUN: ${{ matrix.first-run }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: perf-${{ strategy.job-index }}
          path: |
            test-results/perf/
            test-results/**/error-context.md
          retention-days: 7

  perf:
    # The parts' work budgets as one report, and proof that between them they
    # counted every budgeted action on each of the two runs and timed it, once
    # each, and that run 2 counted what run 1 did, and that one part ran the
    # response-time budgets. The parts that counted run 1, and the response
    # times, have already been held to their budgets. Run even when a part failed, so a red run
    # still reports what was counted, and failed then.
    needs: [changes, perf-part]
    if: always() && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: perf-*
          path: perf-parts

      # Every action counted twice, a count that differs between the two runs
      # failing, so the work clock stays proven deterministic on the runners;
      # and the latency budgets' results there, from the part that ran them.
      - name: The work budgets and the latency budgets, every part together
        run: node tools/perf/combine-budgets.ts perf-parts

      - name: Every part passed
        env:
          PARTS: ${{ needs.perf-part.result }}
        run: |
          echo "perf parts: $PARTS"
          [ "$PARTS" = success ]

  gate:
    # The one check to require. `always()` because a job skipped after a failed
    # dependency counts as passing, which would let a red run through. So a skip
    # is accepted only where `changes` asked for it: a docs-only change.
    needs: [changes, static, unit, coverage, rust, e2e, perf]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job that should have run to pass
        env:
          NEEDS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          echo "code changed: ${CODE:-unknown}"
          jq -e --arg code "$CODE" '
            (if $code == "false" then "skipped" else "success" end) as $slow
            | .changes.result == "success"
              and .static.result == "success"
              and ([.unit, .coverage, .rust, .e2e, .perf] | all(.result == $slow))
          ' <<< "$NEEDS"
