name: github-vault-real

# The GitHub vault (#664) against real GitHub, on a throwaway private
# repository: the one test that leaves the machine. Started by hand only
# (`gh workflow run github-vault-real`), never on a push, a pull request or
# a schedule, and never by an agent. It needs the secret
# DFAI_TEST_VAULT_TOKEN, a fine-grained token with Contents read and write on
# that repository alone, and the variable DFAI_TEST_VAULT_REPO (`owner/repo`).
# Without them the test skips.

on:
  workflow_dispatch:

concurrency:
  group: github-vault-real
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  real:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run the GitHub vault against the throwaway repository
        env:
          DFAI_TEST_VAULT_TOKEN: ${{ secrets.DFAI_TEST_VAULT_TOKEN }}
          DFAI_TEST_VAULT_REPO: ${{ vars.DFAI_TEST_VAULT_REPO }}
        run: pnpm exec vitest run --config vitest.real.config.ts
