name: e2e-macos-nightly

# The whole end-to-end suite in macOS WebKit, the engine the Tauri window uses,
# on `main`, opening an issue when it fails. The pull-request gate runs the
# suite on Linux WebKit (gate.yml); this is where the `@mac` tests run, and
# where anything else that only macOS WebKit does differently shows up.
# macOS minutes are free on a public repository; 09:17 UTC is after the
# evening's merges. Also started by hand: `gh workflow run e2e-macos-nightly`.

on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  # MEASURING PR #649 ONLY: removed before review.
  push:
    branches: [ci-speed-e2e]

concurrency:
  group: e2e-macos-nightly
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  e2e:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: e2e macOS (${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # As gate.yml's `e2e` job keys it: Playwright builds WebKit per OS release.
      - name: Read the Playwright version and the OS release
        id: playwright
        run: |
          echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
          echo "os=${ImageOS}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: webkit
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ steps.playwright.outputs.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Install WebKit for end-to-end tests
        if: steps.webkit.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps webkit

      # One worker: with two, a 3-vCPU Mac missed a five-second wait or two a
      # run (#649). Here time is cheap and a false alarm is not.
      - name: End-to-end, a quarter of the suite
        run: pnpm e2e --shard=${{ matrix.shard }}/4 --workers=1 --reporter=list,html

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: nightly-playwright-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  report:
    # One open issue for a red streak: a second failure comments on it. Only
    # for `main`: a run started on a branch is someone's trial, not news.
    needs: e2e
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the nightly-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          title='Nightly macOS e2e failed on main'
          body="The macOS end-to-end run on \`${SHA:0:8}\` failed: $RUN_URL"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
