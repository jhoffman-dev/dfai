# DIAGNOSTIC (temporary, removed before the PR): counts Today's tick and choose many times on several machines.
name: today-variance

on:
  push:
    branches: [fix-today-count-variance]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [short, full]
        delay: [0, 2, 10, 40]
        load: [idle, busy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # WebKit and the apt packages it needs come from caches, so a slow apt
      # mirror costs a run only when a key changes (#519). Both are restored and
      # saved as separate steps, not with `actions/cache`'s post step, so a run
      # whose budgets fail still saves what it downloaded.
      - name: Read the Playwright version and the runner image
        id: playwright
        run: |
          {
            echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)"
            echo "os=${ImageOS}"
            echo "image=${ImageOS}-${ImageVersion}"
          } >> "$GITHUB_OUTPUT"

      # Fail a dead connection fast and retry it. A trickling one is caught by
      # the time limits in tools/ci/install-webkit-deps.sh instead.
      - name: Make apt time out and retry
        run: |
          printf '%s\n' 'Acquire::Retries "3";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-519 > /dev/null

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: webkit
        with:
          path: ~/.cache/ms-playwright
          # The release (ubuntu24) but not the image version: WebKit is built
          # per Ubuntu release, and weekly image updates do not change it.
          key: playwright-webkit-${{ runner.os }}-${{ steps.playwright.outputs.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Install WebKit
        if: steps.webkit.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: pnpm exec playwright install webkit

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.webkit.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.webkit.outputs.cache-primary-key }}

      # The .deb files apt downloaded for WebKit, keyed on the runner image so
      # they match what is already installed on it. A new image misses once.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: webkit-debs
        with:
          path: ~/.cache/webkit-debs
          key: webkit-debs-${{ steps.playwright.outputs.image }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      # A hit installs from the cached files with no download at all. A miss
      # downloads only what WebKit lacks, under a time limit with retries (the
      # script says how), and keeps the files for the next run. A failure here
      # stops the job: nothing after it can run without these packages.
      - name: Install WebKit's system packages
        timeout-minutes: 9
        env:
          WEBKIT_DEBS_CACHE_HIT: ${{ steps.webkit-debs.outputs.cache-hit }}
        run: tools/ci/install-webkit-deps.sh "$HOME/.cache/webkit-debs"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.webkit-debs.outputs.cache-hit != 'true'
        with:
          path: ~/.cache/webkit-debs
          key: ${{ steps.webkit-debs.outputs.cache-primary-key }}

      # One build for both runs, unminified so the work budgets can name the
      # components that rendered. So the response-time budgets here time the
      # unminified bundle, not the shipped one: a little slower to parse, which
      # their headroom covers. `pnpm perf` locally builds minified, so its
      # times differ a little from this job's.
      - name: Build the frontend, keeping component names
        id: build
        run: pnpm --filter @dfai/desktop exec vite build --minify false

      - name: Today's tick and choose, counted again and again
        run: |
          if [ "${{ matrix.load }}" = busy ]; then
            for _ in $(seq "$(nproc)"); do (while :; do :; done) & done
          fi
          pnpm exec playwright test --config playwright.perf.config.ts --project budgets --reporter=list
        env:
          PERF_TODAY_LOOP: ${{ matrix.mode == 'full' && 8 || 16 }}
          PERF_TODAY_LOOP_MODE: ${{ matrix.mode }}
          PERF_TODAY_MACHINE: d${{ matrix.delay }}-${{ matrix.load }}
          PERF_HOST_DELAY_MS: ${{ matrix.delay }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: today-loop-${{ matrix.mode }}-d${{ matrix.delay }}-${{ matrix.load }}
          path: test-results/perf/today-loop/
