<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      The page runs only its own scripts and talks only to its own origin
      and GitHub's API, where the vault is (#667): no inline script, nothing
      fetched from anywhere else. 'wasm-unsafe-eval' lets the index compile
      SQLite's WebAssembly (#666), and nothing else; no string becomes code. As the desktop's
      index.html, frame-src 'none' keeps a saved artifact's srcdoc frame from
      loading a live remote page in its place; srcdoc and about:blank are
      never subject to it. `pnpm dev` loosens this for Vite's own client
      (vite.config.ts); the build ships it as written here.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' https://api.github.com; frame-src 'none'; object-src 'none'; base-uri 'none'"
    />
    <!-- viewport-fit=cover: full screen from the Home Screen (#668); the shell pads its edges by the safe-area insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DFAI</title>
    <!-- Installable (#668): the manifest for Add to Home Screen, and what iPadOS reads from the page instead. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="DFAI" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f6f6f7" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
