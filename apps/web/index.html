<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      As the desktop's index.html: a saved artifact is shown in a srcdoc
      frame, and frame-src 'none' keeps that frame from loading a live remote
      page in its place. srcdoc and about:blank are never subject to it.
    -->
    <meta http-equiv="Content-Security-Policy" content="frame-src 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DFAI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
